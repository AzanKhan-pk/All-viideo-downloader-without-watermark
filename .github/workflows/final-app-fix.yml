name: Final downloader app fix

on:
  push:
    paths:
      - '.github/workflows/final-app-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app and desktop launcher
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')

          text = text.replace('import shutil\nimport subprocess', 'import shutil\nimport subprocess\nimport os')
          text = text.replace(
              'DOWNLOAD_DIR = BASE_DIR / "downloads"\nTEMP_DIR = BASE_DIR / "temp_downloads"',
              'DEFAULT_DOWNLOAD_DIR = Path(os.environ.get("AVD_DOWNLOAD_DIR", Path.home() / "Downloads" / "Video downloader")).expanduser()\nDOWNLOAD_DIR = DEFAULT_DOWNLOAD_DIR.resolve()\nTEMP_DIR = BASE_DIR / "temp_downloads"'
          )
          text = text.replace(
              'DOWNLOAD_DIR.mkdir(parents=True, exist_ok=True)',
              'DOWNLOAD_DIR.mkdir(parents=True, exist_ok=True)'
          )

          marker = '# =========================================================\n# EXTRACTORS\n# ========================================================='
          routes = r'''# =========================================================
# LOCAL APP FOLDER CONTROLS
# =========================================================

@app.get("/api/download-directory")
def download_directory():
    return jsonify({"directory": str(DOWNLOAD_DIR)})


@app.post("/api/set-download-directory")
def set_download_directory():
    if os.environ.get("AVD_DESKTOP_APP") != "1":
        return jsonify({"error": "Folder selection is available in the desktop app."}), 403

    data = request.get_json(silent=True) or {}
    requested = str(data.get("directory") or "").strip()
    if not requested:
        return jsonify({"error": "No folder was selected."}), 400

    selected = Path(requested).expanduser().resolve()
    selected.mkdir(parents=True, exist_ok=True)

    global DOWNLOAD_DIR
    DOWNLOAD_DIR = selected
    os.environ["AVD_DOWNLOAD_DIR"] = str(selected)

    return jsonify({"success": True, "directory": str(DOWNLOAD_DIR)})


@app.post("/api/open-folder")
def open_download_folder():
    if os.environ.get("AVD_DESKTOP_APP") != "1":
        return jsonify({"error": "Open in Folder is available in the desktop app."}), 403

    try:
        DOWNLOAD_DIR.mkdir(parents=True, exist_ok=True)
        if os.name == "nt":
            os.startfile(str(DOWNLOAD_DIR))
        elif sys.platform == "darwin":
            subprocess.Popen(["open", str(DOWNLOAD_DIR)])
        else:
            subprocess.Popen(["xdg-open", str(DOWNLOAD_DIR)])
        return jsonify({"success": True, "directory": str(DOWNLOAD_DIR)})
    except Exception as error:
        return jsonify({"error": str(error)}), 500


'''
          routes = routes.replace('import sys\n', '')
          # sys is needed only on macOS branch; add it at top if missing.
          if 'import sys\n' not in text:
              text = text.replace('import os\n', 'import os\nimport sys\n')
          if 'def download_directory()' not in text:
              text = text.replace(marker, routes + marker)

          app.write_text(text, encoding='utf-8')

          launcher = Path('windows/launcher.py')
          lt = launcher.read_text(encoding='utf-8')
          lt = lt.replace('APP_VERSION = "1.0.0"', 'APP_VERSION = "2026.09.09"')
          lt = lt.replace('def start_server(data_root: Path):', 'os.environ["AVD_DESKTOP_APP"] = "1"\n    os.environ.setdefault("AVD_DOWNLOAD_DIR", str(Path.home() / "Downloads" / "Video downloader"))\n\ndef start_server(data_root: Path):')
          api_class = '''\n\nclass DesktopAPI:\n    def browse_folder(self):\n        try:\n            result = webview.active_window().create_file_dialog(webview.FileDialog.FOLDER)\n            if not result:\n                return None\n            return result[0] if isinstance(result, (list, tuple)) else result\n        except Exception:\n            return None\n\n    def open_folder(self, path=None):\n        try:\n            target = Path(path) if path else Path(os.environ.get("AVD_DOWNLOAD_DIR", Path.home() / "Downloads" / "Video downloader"))\n            target.mkdir(parents=True, exist_ok=True)\n            if os.name == "nt":\n                os.startfile(str(target))\n            elif sys.platform == "darwin":\n                subprocess.Popen(["open", str(target)])\n            else:\n                subprocess.Popen(["xdg-open", str(target)])\n            return True\n        except Exception:\n            return False\n'''
          if 'class DesktopAPI:' not in lt:
              lt = lt.replace('\ndef main():', api_class + '\n\ndef main():')
          lt = lt.replace('webview.create_window(APP_NAME, f"http://127.0.0.1:{PORT}", width=1200, height=820, min_size=(900, 650))', 'webview.settings["ALLOW_DOWNLOADS"] = True\n    webview.create_window(APP_NAME, f"http://127.0.0.1:{PORT}", width=1200, height=820, min_size=(900, 650), js_api=DesktopAPI(), text_select=True)')
          launcher.write_text(lt, encoding='utf-8')

          html = Path('templates/index.html')
          ht = html.read_text(encoding='utf-8')

          folder_bar = '''\n    <div class="folderbar">\n        <span>📁 Save folder: <strong id="folderPath">Downloads / Video downloader</strong></span>\n        <button class="small-btn" id="browseFolder" type="button">Browse</button>\n        <button class="small-btn" id="openFolderTop" type="button">Open in Folder</button>\n    </div>\n'''
          if 'id="browseFolder"' not in ht:
              ht = ht.replace('    <div class="modes">', folder_bar + '\n    <div class="modes">', 1)

          style = '''\n.folderbar {\n    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;\n    margin-top:12px; padding:10px 12px; border:1px solid rgba(255,255,255,.08);\n    border-radius:12px; background:rgba(255,255,255,.025); color:#9d9dad; font-size:12px;\n}\n.folderbar strong { color:#d8caff; font-weight:800; }\n.result-title, .job-title, .result-meta, .card p, .about-card p, h1, h2, h3, .brand span {\n    user-select:text; -webkit-user-select:text; cursor:text;\n}\nbutton, a { cursor:pointer; }\n'''
          if '.folderbar {' not in ht:
              ht = ht.replace('</style>', style + '\n</style>', 1)

          js = r'''\n\n/* =========================================================
   DESKTOP APP FOLDER / TEXT SELECTION
========================================================= */

async function refreshFolderPath() {
    try {
        const response = await fetch("/api/download-directory", {cache:"no-store"});
        const data = await response.json();
        if (data.directory) $("#folderPath").textContent = data.directory;
    } catch (_) {}
}

async function browseDownloadFolder() {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.browse_folder) {
        const selected = await window.pywebview.api.browse_folder();
        if (!selected) return;
        const response = await fetch("/api/set-download-directory", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body:JSON.stringify({directory:selected})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not change folder.");
        $("#folderPath").textContent = data.directory;
        showToast("Download folder changed.");
        return;
    }

    if (window.showDirectoryPicker) {
        showToast("Folder selection is available in the Windows app. In a normal browser, downloads are controlled by the browser.");
        return;
    }

    showToast("Use the Windows app for a native Browse folder dialog.");
}

async function openDownloadFolder() {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_folder) {
        const ok = await window.pywebview.api.open_folder();
        if (ok) return;
    }
    try {
        const response = await fetch("/api/open-folder", {method:"POST"});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Open in Folder is available in the Windows app.");
    } catch (error) {
        showToast(error.message);
    }
}

$("#browseFolder").addEventListener("click", browseDownloadFolder);
$("#openFolderTop").addEventListener("click", openDownloadFolder);
refreshFolderPath();

window.addEventListener("pywebviewready", refreshFolderPath);

'''
          if 'async function browseDownloadFolder()' not in ht:
              ht = ht.replace('\n</script>', js + '\n</script>', 1)

          # Add completed-job controls: remove UI only + open folder.
          old = '''<a\n                    class="completed-link"\n                    href="${escapeHtml(\n                        data.download_url\n                    )}"\n                    download="${escapeHtml(\n                        data.filename ||\n                        "download"\n                    )}"\n                >\n                    ⬇ Save ${escapeHtml(\n                        data.filename ||\n                        "File"\n                    )}\n                </a>'''
          new = old + '''\n\n                <button class="small-btn" type="button" onclick="openDownloadFolder()">📂 Open in Folder</button>\n                <button class="small-btn danger" type="button" onclick="removeJobCard('${jobId}')">Remove</button>'''
          if old in ht:
              ht = ht.replace(old, new, 1)

          remove_js = r'''\n\nfunction removeJobCard(jobId) {\n    const record = activeJobs.get(jobId);\n    if (!record) return;\n    stopPolling(jobId);\n    record.element.remove();\n    activeJobs.delete(jobId);\n    updateJobsCount();\n    if (activeJobs.size === 0) $("#downloads").hidden = true;\n    showToast("Removed from the app. The downloaded file was not deleted.");\n}\n'''
          if 'function removeJobCard(jobId)' not in ht:
              ht = ht.replace('\n</script>', remove_js + '\n</script>', 1)

          html.write_text(ht, encoding='utf-8')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/index.html windows/launcher.py
          git diff --cached --quiet && exit 0
          git commit -m "Finalize downloader folder controls and desktop text selection"
          git push
