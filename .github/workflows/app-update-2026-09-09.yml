name: Apply downloader fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[downloader-fix-applied]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested fixes
        shell: python
        run: |
          from pathlib import Path

          # 1) Update yt-dlp and add curl_cffi. TikTok's current extractor
          # requires browser impersonation support on affected requests.
          req = Path('requirements.txt')
          text = req.read_text(encoding='utf-8')
          text = text.replace('yt-dlp>=2026.7.4', 'yt-dlp>=2026.8.19')
          if 'curl_cffi' not in text:
              text = text.rstrip() + '\ncurl_cffi>=0.13.0\n'
          req.write_text(text, encoding='utf-8')

          # 2) Make TikTok requests use yt-dlp browser impersonation while
          # leaving other sites on their normal request path.
          app = Path('app.py')
          text = app.read_text(encoding='utf-8')

          old = '''def extractor_options():\n    return {'''
          new = '''def extractor_options(url=None):\n    options = {'''
          if old not in text:
              raise SystemExit('extractor_options definition not found')
          text = text.replace(old, new, 1)

          old_end = '''        "windowsfilenames": True,\n    }\n'''
          new_end = '''        "windowsfilenames": True,\n    }\n\n    # TikTok has recently required browser-style TLS/request impersonation\n    # for its webpage challenge on some networks. Keep this scoped to TikTok\n    # so other extractors are not unnecessarily forced through impersonation.\n    if url and get_domain(url).endswith("tiktok.com"):\n        options["impersonate"] = "chrome"\n\n    return options\n'''
          if old_end not in text:
              raise SystemExit('extractor_options end not found')
          text = text.replace(old_end, new_end, 1)

          # All three call sites have a local `url` variable.
          text = text.replace('extractor_options()', 'extractor_options(url)')

          # Give TikTok an additional fallback to a combined best format.
          old = '''format_selector = (\n                    f"{video_format_id}+bestaudio/"\n                    f"{video_format_id}"\n                )'''
          new = '''format_selector = (\n                    f"{video_format_id}+bestaudio/"\n                    f"{video_format_id}/best"\n                )'''
          if old not in text:
              raise SystemExit('format selector block not found')
          text = text.replace(old, new, 1)

          app.write_text(text, encoding='utf-8')

          # 3) Keep native PC right-click and Android long-press behavior.
          # The existing page intentionally does not cancel contextmenu, so
          # this is preserved. Add a clearer download-location helper below.
          html = Path('templates/index.html')
          text = html.read_text(encoding='utf-8')

          old = '''            <div\n                    data-field="complete"\n                    style="margin-top:10px"\n                ></div>'''
          # The exact indentation may differ; use the actual compact snippet.
          if old not in text:
              old = '''        <div\n            data-field="complete"\n            style="margin-top:10px"\n        ></div>'''
          if old not in text:
              raise SystemExit('complete container not found')

          # Add a small status line near the download controls without changing
          # the existing layout or behavior.
          marker = '''            Automatically trigger the browser's\n             * real file download once.\n             */'''
          # No-op here: the actual save helper is injected before ABOUT.

          injection_marker = '''/* =========================================================\n   JOB COUNT\n========================================================= */'''
          helper = r'''/* =========================================================
   SAVE / DOWNLOAD LOCATION
========================================================= */

async function saveFileWithBrowse(downloadUrl, filename) {

    if (typeof window.showSaveFilePicker !== "function") {

        showToast(
            "Browse saving is not supported by this browser. The normal download was started."
        );

        const link = document.createElement("a");
        link.href = downloadUrl;
        link.download = filename || "download";
        link.click();
        return;

    }

    try {

        const response = await fetch(downloadUrl, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Unable to read the downloaded file.");
        }

        const blob = await response.blob();
        const extension = (filename || "download").split(".").pop().toLowerCase();
        const mime = extension === "mp3" ? "audio/mpeg" : "video/mp4";

        const handle = await window.showSaveFilePicker({
            id: "video-downloader-save",
            startIn: "downloads",
            suggestedName: filename || "download",
            types: [
                {
                    description: extension === "mp3" ? "MP3 audio" : "MP4 video",
                    accept: {
                        [mime]: [`.${extension}`]
                    }
                }
            ]
        });

        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();

        showToast("Saved to the selected folder.");

    } catch (error) {

        if (error && error.name === "AbortError") {
            return;
        }

        showToast(error.message || "Could not save the file.");
    }
}

'''
          if injection_marker not in text:
              raise SystemExit('JS insertion marker not found')
          text = text.replace(injection_marker, helper + injection_marker, 1)

          # Add a Browse & Save button beside the normal save link.
          old = '''                <a\n                    class="completed-link"\n                    href="${escapeHtml(\n                        data.download_url\n                    )}"\n                    download="${escapeHtml(\n                        data.filename ||\n                        "download"\n                    )}"\n                >\n                    ⬇ Save ${escapeHtml(\n                        data.filename ||\n                        "File"\n                    )}\n                </a>'''
          new = '''                <a\n                    class="completed-link"\n                    href="${escapeHtml(\n                        data.download_url\n                    )}"\n                    download="${escapeHtml(\n                        data.filename ||\n                        "download"\n                    )}"\n                >\n                    ⬇ Save ${escapeHtml(\n                        data.filename ||\n                        "File"\n                    )}\n                </a>\n\n                <button\n                    class="small-btn primary"\n                    type="button"\n                    style="margin-left:8px;margin-top:8px"\n                    data-action="browse-save"\n                >\n                    📁 Browse & Save\n                </button>'''
          if old not in text:
              raise SystemExit('completed link block not found')
          text = text.replace(old, new, 1)

          # Wire the new button after the completed HTML is inserted.
          old = '''            /*\n             * Automatically trigger the browser's\n             * real file download once.\n             */'''
          new = '''            const browseButton = complete.querySelector(\n                '[data-action="browse-save"]'\n            );\n\n            if (browseButton) {\n\n                browseButton.addEventListener(\n                    "click",\n                    () => saveFileWithBrowse(\n                        data.download_url,\n                        data.filename || "download"\n                    )\n                );\n\n            }\n\n            /*\n             * Automatically trigger the browser's\n             * real file download once.\n             */'''
          if old not in text:
              raise SystemExit('auto-download marker not found')
          text = text.replace(old, new, 1)

          html.write_text(text, encoding='utf-8')

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/index.html requirements.txt
          git diff --cached --quiet && exit 0
          git commit -m "Fix downloader filenames, save location and TikTok [downloader-fix-applied]"
          git push

      - name: Remove one-time updater
        if: success()
        run: |
          git rm .github/workflows/app-update-2026-09-09.yml
          git commit -m "Remove one-time updater [downloader-fix-applied]"
          git push
