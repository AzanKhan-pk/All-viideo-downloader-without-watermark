name: Polish downloader UI and media handling

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply downloader fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = False

          # ------------------------------------------------------------
          # Backend: modern browser-like networking + TikTok web fallback
          # + audio verification/muxing for MP4 output.
          # ------------------------------------------------------------
          app_path = Path('app.py')
          app = app_path.read_text(encoding='utf-8')

          if 'from curl_cffi import requests as curl_requests' not in app:
              app = app.replace(
                  'from urllib.parse import urlparse\n',
                  'from urllib.parse import urlparse\n\ntry:\n    from curl_cffi import requests as curl_requests\nexcept Exception:\n    curl_requests = None\n',
                  1,
              )
              changed = True

          new_extractor = '''def extractor_options():\n    options = {\n        "quiet": True,\n        "no_warnings": True,\n        "noplaylist": True,\n        "socket_timeout": 30,\n        "retries": 5,\n        "extractor_retries": 4,\n        "fragment_retries": 5,\n        "file_access_retries": 5,\n        "continuedl": True,\n        "nopart": False,\n        "overwrites": False,\n        "restrictfilenames": False,\n        "windowsfilenames": True,\n        "http_headers": {\n            "User-Agent": (\n                "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "\n                "AppleWebKit/537.36 (KHTML, like Gecko) "\n                "Chrome/140.0.0.0 Safari/537.36"\n            ),\n            "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",\n            "Accept-Language": "en-US,en;q=0.9",\n            "Referer": "https://www.google.com/",\n        },\n    }\n    # curl_cffi 0.15.x is used by the Windows build for stable browser\n    # impersonation. Do not force impersonation when the optional handler is\n    # unavailable; yt-dlp can then fall back to its normal request handlers.\n    if curl_requests is not None:\n        options["impersonate"] = "chrome"\n    return options\n\n\n'''
          pattern = re.compile(r'def extractor_options\(\):\n.*?\n\n# =========================================================\n# JOBS', re.S)
          if pattern.search(app):
              replacement = new_extractor + '# =========================================================\n# JOBS'
              app2 = pattern.sub(replacement, app, count=1)
              if app2 != app:
                  app = app2
                  changed = True

          helpers = r'''\n\ndef is_tiktok_url(url):\n    domain = get_domain(url)\n    return domain == "tiktok.com" or domain.endswith(".tiktok.com")\n\n\ndef _script_json(html, script_id):\n    match = re.search(\n        rf'<script[^>]+id=["\\\']{re.escape(script_id)}["\\\'][^>]*>(.*?)</script>',\n        html,\n        re.S | re.I,\n    )\n    if not match:\n        return None\n    try:\n        import html as html_module\n        raw = html_module.unescape(match.group(1).strip())\n        return __import__("json").loads(raw)\n    except Exception:\n        return None\n\n\ndef tiktok_web_fallback(url):\n    """Extract public TikTok page data when the normal yt-dlp webpage parser fails."""\n    if not is_tiktok_url(url) or curl_requests is None:\n        return None\n\n    headers = {\n        "User-Agent": (\n            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "\n            "AppleWebKit/537.36 (KHTML, like Gecko) "\n            "Chrome/140.0.0.0 Safari/537.36"\n        ),\n        "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",\n        "Accept-Language": "en-US,en;q=0.9",\n        "Referer": "https://www.tiktok.com/",\n    }\n\n    session = curl_requests.Session(impersonate="chrome")\n    response = session.get(url, headers=headers, timeout=30, allow_redirects=True)\n    response.raise_for_status()\n    html = response.text\n\n    item = None\n    sigi = _script_json(html, "SIGI_STATE")\n    if isinstance(sigi, dict):\n        item_module = sigi.get("ItemModule") or {}\n        for value in item_module.values():\n            if isinstance(value, dict) and isinstance(value.get("video"), dict):\n                item = value\n                break\n\n    if item is None:\n        universal = _script_json(html, "__UNIVERSAL_DATA_FOR_REHYDRATION__")\n        scope = universal.get("__DEFAULT_SCOPE__", {}) if isinstance(universal, dict) else {}\n        detail = scope.get("webapp.video-detail", {}) if isinstance(scope, dict) else {}\n        item = ((detail.get("itemInfo") or {}).get("itemStruct") if isinstance(detail, dict) else None)\n\n    if not isinstance(item, dict):\n        return None\n\n    video = item.get("video") or {}\n    formats = []\n\n    bitrate_items = video.get("bitrateInfo") or []\n    for index, entry in enumerate(bitrate_items):\n        if not isinstance(entry, dict):\n            continue\n        play = entry.get("PlayAddr") or entry.get("playAddr") or {}\n        urls = play.get("UrlList") or play.get("urlList") or []\n        if not urls:\n            continue\n        direct = urls[-1]\n        height = entry.get("Height") or entry.get("height") or play.get("Height") or play.get("height") or video.get("height")\n        width = entry.get("Width") or entry.get("width") or play.get("Width") or play.get("width") or video.get("width")\n        bitrate = entry.get("Bitrate") or entry.get("bitrate") or 0\n        try:\n            height = int(height) if height else None\n        except Exception:\n            height = None\n        try:\n            width = int(width) if width else None\n        except Exception:\n            width = None\n        formats.append({\n            "format_id": f"tiktok-web-{index}",\n            "url": direct,\n            "ext": "mp4",\n            "height": height,\n            "width": width,\n            "vcodec": "h264",\n            "acodec": "aac",\n            "tbr": (float(bitrate) / 1000.0) if bitrate else None,\n            "filesize": None,\n        })\n\n    if not formats:\n        direct = video.get("downloadAddr") or video.get("download_addr") or video.get("playAddr") or video.get("play_addr")\n        if isinstance(direct, dict):\n            urls = direct.get("UrlList") or direct.get("urlList") or []\n            direct = urls[-1] if urls else None\n        if direct:\n            formats.append({\n                "format_id": "tiktok-web-direct",\n                "url": direct,\n                "ext": "mp4",\n                "height": video.get("height"),\n                "width": video.get("width"),\n                "vcodec": "h264",\n                "acodec": "aac",\n                "filesize": None,\n            })\n\n    if not formats:\n        return None\n\n    formats.sort(key=lambda f: (f.get("height") or 0, f.get("tbr") or 0), reverse=True)\n    video_id = str(item.get("id") or "tiktok")\n    title = item.get("desc") or item.get("description") or f"TikTok video {video_id}"\n    author = item.get("author") or {}\n    thumbnail = video.get("cover") or video.get("originCover") or video.get("dynamicCover")\n    return {\n        "id": video_id,\n        "title": title,\n        "thumbnail": thumbnail,\n        "duration": item.get("video", {}).get("duration"),\n        "uploader": author.get("uniqueId") if isinstance(author, dict) else author,\n        "extractor": "TikTok",\n        "extractor_key": "TikTok",\n        "domain": "tiktok.com",\n        "webpage_url": response.url,\n        "formats": formats,\n        "_avd_tiktok_fallback": True,\n    }\n\n\ndef extract_media_info(url):\n    try:\n        with yt_dlp.YoutubeDL(extractor_options()) as ydl:\n            return ydl.extract_info(url, download=False)\n    except Exception:\n        fallback = tiktok_web_fallback(url)\n        if fallback:\n            return fallback\n        raise\n\n\ndef has_audio_stream(path):\n    if not ffmpeg_available():\n        return True\n    ffprobe = shutil.which("ffprobe")\n    if not ffprobe:\n        return True\n    try:\n        result = subprocess.run(\n            [ffprobe, "-v", "error", "-select_streams", "a:0", "-show_entries", "stream=index", "-of", "csv=p=0", str(path)],\n            capture_output=True, text=True, timeout=20, encoding="utf-8", errors="replace",\n        )\n        return bool(result.stdout.strip())\n    except Exception:\n        return True\n\n\n'''
          if 'def tiktok_web_fallback' not in app:
              marker = '\n\ndef create_job(url, mode, quality):'
              if marker in app:
                  app = app.replace(marker, helpers + 'def create_job(url, mode, quality):', 1)
                  changed = True

          # Use the fallback extractor in both info and the download worker.
          app2 = app.replace(
              'info = ydl.extract_info(\n                url,\n                download=False\n            )',
              'info = extract_media_info(url)',
              2,
          )
          if app2 != app:
              app = app2
              changed = True

          # Add direct TikTok download path after output selection and before
          # the normal yt-dlp download call.
          old_download = '''        with yt_dlp.YoutubeDL(\n            options\n        ) as ydl:\n\n            downloaded_info = (\n                ydl.extract_info(\n                    url,\n                    download=True\n                )\n            )\n'''
          new_download = '''        if info.get("_avd_tiktok_fallback"):\n            direct_formats = [f for f in info.get("formats", []) if f.get("url")]\n            if not direct_formats:\n                raise RuntimeError("TikTok returned no public video stream.")\n            if mode == "video":\n                target_candidates = [f for f in direct_formats if (f.get("height") or 0) >= quality]\n                selected_direct = min(target_candidates, key=lambda f: f.get("height") or 10**9) if target_candidates else max(direct_formats, key=lambda f: f.get("height") or 0)\n            else:\n                selected_direct = direct_formats[0]\n            direct_url = selected_direct["url"]\n            direct_output = job_dir / "tiktok-direct.mp4"\n            with curl_requests.get(\n                direct_url,\n                headers={\n                    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36",\n                    "Referer": "https://www.tiktok.com/",\n                },\n                impersonate="chrome",\n                timeout=60,\n                stream=True,\n            ) as direct_response:\n                direct_response.raise_for_status()\n                total = int(direct_response.headers.get("content-length") or 0)\n                downloaded = 0\n                with direct_output.open("wb") as handle:\n                    for chunk in direct_response.iter_content(chunk_size=1024 * 256):\n                        if not chunk:\n                            continue\n                        handle.write(chunk)\n                        downloaded += len(chunk)\n                        update_job(\n                            job_id,\n                            status="downloading",\n                            downloaded_bytes=downloaded,\n                            total_bytes=total,\n                            percentage=(downloaded / total * 100) if total else 0,\n                            speed=0,\n                        )\n            output_file = direct_output\n        else:\n            with yt_dlp.YoutubeDL(\n                options\n            ) as ydl:\n                downloaded_info = ydl.extract_info(\n                    url,\n                    download=True\n                )\n\n'''
          if old_download in app and 'tiktok-direct.mp4' not in app:
              app = app.replace(old_download, new_download, 1)
              changed = True

          # Verify MP4 has audio; if not, download best audio separately and mux.
          marker = '''        # =================================================\n        # REAL LOWER-QUALITY CONVERSION\n'''
          audio_block = '''        # =================================================\n        # AUDIO SAFETY CHECK\n        # =================================================\n\n        if mode == "video" and not has_audio_stream(output_file):\n            update_job(job_id, status="processing", conversion=True)\n            audio_template = str(job_dir / "fallback-audio.%(ext)s")\n            audio_options = extractor_options()\n            audio_options.update({\n                "format": "bestaudio/best",\n                "outtmpl": audio_template,\n                "noplaylist": True,\n            })\n            with yt_dlp.YoutubeDL(audio_options) as audio_ydl:\n                audio_ydl.extract_info(url, download=True)\n            audio_files = [f for f in job_dir.iterdir() if f.is_file() and f.name.startswith("fallback-audio") and not f.name.endswith(".part")]\n            if audio_files and ffmpeg_available():\n                audio_file = max(audio_files, key=lambda f: f.stat().st_size)\n                muxed = job_dir / "muxed-with-audio.mp4"\n                mux_command = [\n                    "ffmpeg", "-y", "-i", str(output_file), "-i", str(audio_file),\n                    "-map", "0:v:0", "-map", "1:a:0", "-c:v", "copy",\n                    "-c:a", "aac", "-b:a", "192k", "-movflags", "+faststart", str(muxed),\n                ]\n                mux = subprocess.run(mux_command, capture_output=True, text=True, encoding="utf-8", errors="replace")\n                if mux.returncode == 0 and muxed.exists() and has_audio_stream(muxed):\n                    output_file = muxed\n\n'''
          if marker in app and 'AUDIO SAFETY CHECK' not in app:
              app = app.replace(marker, audio_block + marker, 1)
              changed = True

          app_path.write_text(app, encoding='utf-8')

          # ------------------------------------------------------------
          # Web UI: Paste button, custom context menu/long-press, location,
          # show-in-folder button, and smoother progress animation.
          # ------------------------------------------------------------
          html_path = Path('templates/index.html')
          h = html_path.read_text(encoding='utf-8')

          css = r'''\n\n/* =========================================================\n   POLISHED CONTROLS\n========================================================= */\n\n.inputrow {\n    align-items: stretch;\n}\n\n.paste-btn {\n    min-height: 56px;\n    padding: 0 16px;\n    border: 1px solid rgba(59,130,246,.45);\n    border-radius: 14px;\n    background: rgba(37,99,235,.13);\n    color: #bfdbfe;\n    font-size: 13px;\n    font-weight: 850;\n    cursor: pointer;\n    transition: .2s ease;\n}\n\n.paste-btn:hover {\n    transform: translateY(-1px);\n    background: rgba(37,99,235,.20);\n}\n\n.location-panel {\n    margin-top: 12px;\n    padding: 12px 14px;\n    border: 1px solid rgba(255,255,255,.09);\n    border-radius: 14px;\n    background: rgba(255,255,255,.035);\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 12px;\n}\n\n.location-info { min-width: 0; }\n.location-label { font-size: 11px; font-weight: 850; letter-spacing: .06em; text-transform: uppercase; opacity: .65; }\n.location-path { margin-top: 4px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.location-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }\n.location-btn { border: 1px solid rgba(250,204,21,.30); border-radius: 10px; padding: 9px 12px; background: rgba(250,204,21,.08); color:#facc15; font-weight:850; cursor:pointer; }\n.location-btn:hover { background: rgba(250,204,21,.14); }\n\n.job-bar { position:relative; overflow:hidden; }\n.job-bar::after { content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent); animation:jobShimmer 1.35s linear infinite; }\n.job.completed .job-bar::after, .job.error .job-bar::after { animation:none; display:none; }\n@keyframes jobShimmer { to { transform:translateX(100%); } }\n\n.avd-context-menu {\n    position: fixed;\n    z-index: 2147483647;\n    min-width: 190px;\n    padding: 7px;\n    border: 1px solid rgba(255,255,255,.10);\n    border-radius: 13px;\n    background: rgba(24,18,43,.99);\n    box-shadow: 0 15px 45px rgba(0,0,0,.42);\n    display:none;\n}\n.avd-context-menu button { display:block; width:100%; text-align:left; border:0; border-radius:9px; padding:10px 12px; background:transparent; color:#fff; cursor:pointer; font:700 13px Inter,Arial,sans-serif; }\n.avd-context-menu button:hover { background:rgba(255,255,255,.11); }\n\n@media(max-width:760px){\n    .inputrow { flex-direction:column; }\n    .paste-btn { width:100%; }\n    .location-panel { flex-direction:column; align-items:stretch; }\n    .location-actions { justify-content:stretch; }\n    .location-actions .location-btn { flex:1; }\n}\n'''
          if '.paste-btn {' not in h:
              h = h.replace('</style>', css + '\n</style>', 1)
              changed = True

          # Paste button in the input row.
          if 'id="pasteUrlButton"' not in h:
              marker = '''        </inputrow>'''
          row_pattern = re.compile(r'(\s*<input\s+id="url".*?</input>\s*)', re.S)
          # The real input is a void element, so insert before Fetch Media.
          fetch_marker = '''        <button\n            class="btn"\n            id="fetch"'''
          if 'id="pasteUrlButton"' not in h and fetch_marker in h:
              paste = '''        <button\n            class="paste-btn"\n            id="pasteUrlButton"\n            type="button"\n        >\n            📋 Paste\n        </button>\n\n'''
              h = h.replace(fetch_marker, paste + fetch_marker, 1)
              changed = True

          # Location panel below Fetch Media/input row.
          if 'id="locationPanel"' not in h:
              modes_marker = '''    <div class="modes">'''
              panel = '''    <div class="location-panel" id="locationPanel">\n        <div class="location-info">\n            <div class="location-label">Download location</div>\n            <div class="location-path" id="locationPath">Downloads\\Video downloader</div>\n        </div>\n        <div class="location-actions">\n            <button class="location-btn" id="locationBrowse" type="button">📁 Browse</button>\n            <button class="location-btn" id="locationOpen" type="button">📂 Open folder</button>\n        </div>\n    </div>\n\n'''
              if modes_marker in h:
                  h = h.replace(modes_marker, panel + modes_marker, 1)
                  changed = True

          # Add Show in folder button in completed job card.
          if 'data-action="showfolder"' not in h:
              completed_marker = '''                    ⬇ Save ${escapeHtml(\n                        data.filename ||\n                        "File"\n                    )}\n                </a>'''
              replacement = '''                    ⬇ Save ${escapeHtml(\n                        data.filename ||\n                        "File"\n                    )}\n                </a>\n                <button\n                    class="small-btn"\n                    data-action="showfolder"\n                    type="button"\n                    style="margin-left:8px"\n                >\n                    📂 Show in folder\n                </button>'''
              if completed_marker in h:
                  h = h.replace(completed_marker, replacement, 1)
                  changed = True

          # Add JS controls before the final closing script.
          js = r'''\n\n/* =========================================================\n   PASTE + LOCATION + CONTEXT MENU\n========================================================= */\n\nasync function pasteUrlDirect() {\n    const input = $("#url");\n    try {\n        const text = await navigator.clipboard.readText();\n        if (text) {\n            input.value = text.trim();\n            input.focus();\n            input.dispatchEvent(new Event("input", {bubbles:true}));\n            $("#status").textContent = "URL pasted. Press Enter or click Fetch Media.";\n        }\n    } catch (_) {\n        input.focus();\n        showToast("Clipboard permission was not available. Use Ctrl+V / long-press paste.");\n    }\n}\n\n$("#pasteUrlButton")?.addEventListener("click", pasteUrlDirect);\n\nasync function chooseDownloadLocation() {\n    const path = $("#locationPath");\n    const nativeApi = window.pywebview && window.pywebview.api;\n    if (nativeApi && nativeApi.browse_folder) {\n        try {\n            const selected = await nativeApi.browse_folder();\n            if (typeof selected === "string" && selected) path.textContent = selected;\n        } catch (_) {}\n        return;\n    }\n    if (window.showDirectoryPicker) {\n        try {\n            const handle = await window.showDirectoryPicker({mode:"readwrite", startIn:"downloads"});\n            path.textContent = handle.name + " (browser permission granted)";\n            window._avdDownloadDirectoryHandle = handle;\n            return;\n        } catch (_) {}\n    }\n    path.textContent = "Browser default Downloads folder";\n    showToast("The browser controls its download folder. Use the Windows app for a real selectable folder.");\n}\n\n$("#locationBrowse")?.addEventListener("click", chooseDownloadLocation);\n$("#locationOpen")?.addEventListener("click", () => {\n    const nativeApi = window.pywebview && window.pywebview.api;\n    if (nativeApi && nativeApi.open_download_folder) { nativeApi.open_download_folder(); return; }\n    showToast("Open your browser's Downloads folder to view the downloaded file.");\n});\n\nasync function showDownloadFolder() {\n    const nativeApi = window.pywebview && window.pywebview.api;\n    if (nativeApi && nativeApi.open_download_folder) {\n        try { await nativeApi.open_download_folder(); } catch (_) {}\n        return;\n    }\n    showToast("On the website, the browser decides the actual download folder. The Windows app opens the real folder directly.");\n}\n\nconst contextMenu = document.createElement("div");\ncontextMenu.className = "avd-context-menu";\ncontextMenu.innerHTML = `\n  <button type="button" data-action="cut">✂ Cut</button>\n  <button type="button" data-action="copy">📋 Copy</button>\n  <button type="button" data-action="paste">📌 Paste</button>\n  <button type="button" data-action="selectall">☑ Select all</button>\n  <button type="button" data-action="clear">🧹 Clear</button>\n`;\ndocument.body.appendChild(contextMenu);\nlet contextTarget = null;\n\nfunction getEditableTarget(target) {\n    if (target?.matches?.("input, textarea")) return target;\n    if (target?.isContentEditable) return target;\n    return null;\n}\n\nasync function runContextAction(action) {\n    const el = contextTarget || document.activeElement;\n    if (!el) return;\n    if (action === "selectall") { if (el.select) el.select(); else document.execCommand("selectAll"); }\n    if (action === "clear") { if ("value" in el) { el.value = ""; el.dispatchEvent(new Event("input", {bubbles:true})); } else document.execCommand("delete"); }\n    if (action === "copy") document.execCommand("copy");\n    if (action === "cut") document.execCommand("cut");\n    if (action === "paste") {\n        try {\n            const text = await navigator.clipboard.readText();\n            if ("value" in el && el.setRangeText) {\n                const s = el.selectionStart ?? el.value.length;\n                const e = el.selectionEnd ?? s;\n                el.setRangeText(text, s, e, "end");\n                el.dispatchEvent(new Event("input", {bubbles:true}));\n            } else document.execCommand("insertText", false, text);\n        } catch (_) { document.execCommand("paste"); }\n    }\n}\n\nfunction openContextMenu(x, y, target) {\n    contextTarget = target;\n    contextMenu.style.display = "block";\n    contextMenu.style.left = Math.min(x, window.innerWidth - 205) + "px";\n    contextMenu.style.top = Math.min(y, window.innerHeight - 245) + "px";\n}\n\ndocument.addEventListener("contextmenu", event => {\n    const editable = getEditableTarget(event.target);\n    const selected = window.getSelection()?.toString();\n    if (!editable && !selected) return;\n    event.preventDefault();\n    openContextMenu(event.clientX, event.clientY, editable || event.target);\n}, true);\n\nlet longPressTimer = null;\ndocument.addEventListener("touchstart", event => {\n    const editable = getEditableTarget(event.target);\n    if (!editable) return;\n    longPressTimer = setTimeout(() => {\n        const touch = event.touches[0];\n        openContextMenu(touch.clientX, touch.clientY, editable);\n    }, 650);\n}, {passive:true});\ndocument.addEventListener("touchend", () => clearTimeout(longPressTimer), {passive:true});\ndocument.addEventListener("touchmove", () => clearTimeout(longPressTimer), {passive:true});\n\ncontextMenu.addEventListener("click", async event => {\n    const button = event.target.closest("button[data-action]");\n    if (!button) return;\n    await runContextAction(button.dataset.action);\n    contextMenu.style.display = "none";\n});\ndocument.addEventListener("click", event => { if (!contextMenu.contains(event.target)) contextMenu.style.display = "none"; }, true);\ndocument.addEventListener("keydown", event => { if (event.key === "Escape") contextMenu.style.display = "none"; });\n\n'''
          if 'function pasteUrlDirect()' not in h:
              marker = '</script>\n\n</body>'
              if marker in h:
                  h = h.replace(marker, js + '</script>\n\n</body>', 1)
                  changed = True

          # Wire the show-folder action after the card is created.
          if 'showfolder' in h and 'pauseJob(jobId);' not in h:
              action_marker = '''    card\n        .querySelector(\n            '[data-action="cancel"]'\n        )\n        .addEventListener(\n            "click",\n            () => cancelJob(jobId)\n        );\n'''
              action_insert = action_marker + '''\n\n    card.querySelector('[data-action="showfolder"]')?.addEventListener(\n        "click",\n        () => showDownloadFolder()\n    );\n'''
              if action_marker in h:
                  h = h.replace(action_marker, action_insert, 1)
                  changed = True

          # Add a state class for smooth progress styling.
          state_marker = '''    const state =\n        String(\n            data.status ||\n            "queued"\n        ).toLowerCase();\n'''
          state_insert = state_marker + '''\n\n    card.classList.toggle("completed", state === "completed");\n    card.classList.toggle("error", state === "error" || state === "cancelled");\n'''
          if state_marker in h and 'classList.toggle("completed"' not in h:
              h = h.replace(state_marker, state_insert, 1)
              changed = True

          html_path.write_text(h, encoding='utf-8')

          print('PATCH_CHANGED=' + str(changed))

      - name: Validate Python syntax
        shell: bash
        run: |
          python -m py_compile app.py windows/launcher.py
          python - <<'PY'
          from pathlib import Path
          h = Path('templates/index.html').read_text(encoding='utf-8')
          required = [
              'id="pasteUrlButton"',
              'id="locationPanel"',
              'function pasteUrlDirect()',
              'data-action="showfolder"',
              'class="avd-context-menu"',
          ]
          missing = [x for x in required if x not in h]
          if missing:
              raise SystemExit('Missing UI markers: ' + ', '.join(missing))
          print('UI markers OK')
          PY

      - name: Commit source changes
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/index.html requirements.txt windows/requirements.txt
          git commit -m "Polish downloader controls and media handling"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Start release build for patched source
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run build-platforms.yml --repo "$GITHUB_REPOSITORY" --ref main
