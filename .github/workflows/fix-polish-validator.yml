name: Fix polish workflow validator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix validator marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/polish-media-downloader.yml')
          s = p.read_text(encoding='utf-8')
          old = "              'class=\"avd-context-menu\"',\n"
          new = "              'avd-context-menu',\n"
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('validator fixed')
          else:
              print('validator already fixed')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/polish-media-downloader.yml
          git commit -m "Fix polish workflow validation"
          git push
