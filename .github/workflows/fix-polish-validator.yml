name: Fix polish workflow validator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required UI markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          h = Path('templates/index.html').read_text(encoding='utf-8')
          required = [
              'id="pasteUrlButton"',
              'id="locationPanel"',
              'function pasteUrlDirect()',
              'data-action="showfolder"',
              'class="avd-context-menu"',
          ]
          missing = [x for x in required if x not in h]
          if missing:
              raise SystemExit('Missing UI markers: ' + ', '.join(missing))
          print('validator OK')
          PY
