name: Fixed release build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FIXED_TAG: fixed-${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ensure required Python imports
        shell: pwsh
        run: python tools/ensure_os_import.py
      - name: Apply targeted fixes
        run: |
          python tools/release_patch.py
          python tools/tiktok_focus_patch.py
          python tools/ui_polish_patch.py
          python tools/persistence_gallery_patch.py
          python tools/fix_windows_runtime.py
          python tools/final_browser_architecture.py
          python tools/final_download_reliability_patch.py
      - name: Validate generated Windows launcher
        shell: pwsh
        run: python -m py_compile windows/launcher.py
      - name: Validate patched Python backend
        shell: pwsh
        run: python -m py_compile app.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure installable Android release
        shell: pwsh
        run: |
          $gradle = Get-Content android/app/build.gradle -Raw
          if ($gradle -notmatch 'signingConfig signingConfigs.debug') {
            $insert = '$1' + [Environment]::NewLine + '    buildTypes { release { signingConfig signingConfigs.debug } }'
            $gradle = $gradle -replace '(android \{)', $insert
            Set-Content android/app/build.gradle $gradle -NoNewline
          }
      - name: Build Android APK
        shell: pwsh
        run: |
          $env:APP_VERSION_CODE = "${{ github.run_number }}"
          $env:APP_VERSION = "1.0.${{ github.run_number }}"
          (Get-Content android/app/build.gradle -Raw) `
            -replace 'versionCode [0-9]+', "versionCode $env:APP_VERSION_CODE" `
            -replace "versionName '[^']*'", "versionName '$env:APP_VERSION'" `
            | Set-Content android/app/build.gradle -NoNewline
          $main = Get-Content android/app/src/main/java/pk/azankhan/alldownloader/MainActivity.kt -Raw
          $main = [regex]::Replace($main, 'private val currentVersion = "[^"]*"', "private val currentVersion = `"$env:APP_VERSION`"")
          Set-Content android/app/src/main/java/pk/azankhan/alldownloader/MainActivity.kt $main -NoNewline
          gradle --no-daemon --stacktrace -p android assembleRelease
          $apk = Get-ChildItem android/app/build/outputs -Recurse -File -Filter *.apk | Select-Object -First 1
          if (-not $apk) { throw 'Android APK was not produced.' }
          Copy-Item $apk.FullName release-android.apk
          $apksigner = Get-ChildItem "$env:ANDROID_HOME/build-tools" -Recurse -Filter apksigner.bat | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $apksigner) { throw 'Android apksigner was not found.' }
          & $apksigner.FullName verify --verbose release-android.apk
      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt
          choco install ffmpeg imagemagick innosetup -y --no-progress
      - name: Download bundled Chromium app shell
        shell: pwsh
        run: |
          $revision = (Invoke-WebRequest -UseBasicParsing 'https://commondatastorage.googleapis.com/chromium-browser-snapshots/Win_x64/LAST_CHANGE').Content.Trim()
          if (-not $revision) { throw 'Chromium snapshot revision was empty.' }
          $zip = Join-Path $env:RUNNER_TEMP "chromium-$revision.zip"
          $url = "https://commondatastorage.googleapis.com/chromium-browser-snapshots/Win_x64/$revision/chrome-win.zip"
          Write-Host "Downloading Chromium snapshot $revision"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip
          $extract = Join-Path $env:RUNNER_TEMP "chromium-$revision"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $chromeDir = Get-ChildItem $extract -Directory -Recurse | Where-Object { Test-Path (Join-Path $_.FullName 'chrome.exe') } | Select-Object -First 1
          if (-not $chromeDir) { throw 'Bundled Chromium chrome.exe was not found.' }
          if (Test-Path windows/avd_browser) { Remove-Item windows/avd_browser -Recurse -Force }
          New-Item -ItemType Directory -Force windows/avd_browser | Out-Null
          Copy-Item (Join-Path $chromeDir.FullName '*') windows/avd_browser -Recurse -Force
          if (-not (Test-Path windows/avd_browser/chrome.exe)) { throw 'Bundled Chromium copy failed.' }
          # Keep only the English locale. Chromium can run without the unused translation packs,
          # which removes a large amount of duplicate language data from the installer.
          $locales = Join-Path $chromeDir.FullName 'locales'
          if (Test-Path $locales) {
            Get-ChildItem $locales -File -Filter '*.pak' | Where-Object { $_.Name -ne 'en-US.pak' } | Remove-Item -Force
            Get-ChildItem windows/avd_browser/locales -File -Filter '*.pak' | Where-Object { $_.Name -ne 'en-US.pak' } | Remove-Item -Force
          }
          Set-Content windows/avd_browser/version.txt $revision -NoNewline
      - name: Set Windows version
        shell: pwsh
        run: |
          $launcher = Get-Content windows/launcher.py -Raw
          $launcher = [regex]::Replace($launcher, 'APP_VERSION = "[^"]*"', 'APP_VERSION = "1.0.${{ github.run_number }}"')
          Set-Content windows/launcher.py $launcher -NoNewline
          $iss = Get-Content windows/setup.iss -Raw
          $iss = [regex]::Replace($iss, '#define MyAppVersion "[^"]*"', '#define MyAppVersion "1.0.${{ github.run_number }}"')
          Set-Content windows/setup.iss $iss -NoNewline
      - name: Generate ICO
        shell: pwsh
        run: magick static/icon.svg -background none -define icon:auto-resize=256,128,64,48,32,16 windows/app.ico
      - name: Verify Windows sources
        shell: pwsh
        run: |
          foreach ($f in @('windows/launcher.py','windows/app.spec','windows/setup.iss')) { if (-not (Test-Path $f)) { throw "$f is missing from checkout." } }
          if (-not (Test-Path windows/avd_browser/chrome.exe)) { throw 'Bundled Chromium app shell is missing.' }
          if (-not (Test-Path windows/avd_browser/locales/en-US.pak)) { throw 'Chromium English locale is missing.' }
      - name: Build Windows application
        shell: pwsh
        run: pyinstaller --noconfirm --clean windows/app.spec
      - name: Bundle Chromium app shell into Windows build
        shell: pwsh
        run: |
          if (Test-Path dist/All-Video-Downloader/avd_browser) { Remove-Item dist/All-Video-Downloader/avd_browser -Recurse -Force }
          New-Item -ItemType Directory -Force dist/All-Video-Downloader/avd_browser | Out-Null
          Copy-Item windows/avd_browser/* dist/All-Video-Downloader/avd_browser -Recurse -Force
          if (-not (Test-Path dist/All-Video-Downloader/avd_browser/chrome.exe)) { throw 'Chromium app shell was not bundled into dist.' }
      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/All-Video-Downloader/tools | Out-Null
          Copy-Item (Get-Command ffmpeg).Source dist/All-Video-Downloader/tools/ffmpeg.exe
          Copy-Item (Get-Command ffprobe).Source dist/All-Video-Downloader/tools/ffprobe.exe
      - name: Build Windows installer
        shell: pwsh
        run: |
          # Use the compression setting committed in windows/setup.iss; do not override it here.
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' (Resolve-Path windows/setup.iss)
          if (-not (Test-Path release/All-Video-Downloader-Setup.exe)) { throw 'Windows installer was not produced.' }
      - name: Publish isolated fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${FIXED_TAG}" release-android.apk release/All-Video-Downloader-Setup.exe --repo "$GITHUB_REPOSITORY" --title "Fixed media build ${FIXED_TAG}" --notes "Packaging-optimized build: unused Chromium locale packs removed and installer LZMA2 compression increased. Core app functionality is unchanged. Reliable mobile/background downloads, Android foreground progress notification, persistent restart/resume history, removable download cards, download location/open-folder controls, public image gallery with multi-select and separate image folders, TikTok-focused extraction reliability without forcing curl impersonation on Android, Pinterest media support through yt-dlp extractors, short-video focused format selection, and a bundled Chromium app shell on Windows so the desktop app does not depend on installed Chrome/Edge. The Windows shell uses software rendering flags for legacy-GPU compatibility. Supports public media only and does not bypass DRM, private access, or restricted content."
