name: Build Android and Windows releases

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable AndroidX
        run: echo 'android.useAndroidX=true' >> android/gradle.properties
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Find and rename APK
        shell: bash
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" All-Video-Downloader.apk
          ls -lh All-Video-Downloader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: All-Video-Downloader-Android
          path: All-Video-Downloader.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt
          choco install ffmpeg imagemagick innosetup -y --no-progress
      - name: Generate ICO from project SVG
        shell: pwsh
        run: magick static/icon.svg -background none -define icon:auto-resize=256,128,64,48,32,16 windows/app.ico
      - name: Verify Windows sources
        shell: pwsh
        run: |
          foreach ($f in @('windows/launcher.py','windows/app.spec','windows/setup.iss')) { if (-not (Test-Path $f)) { throw "$f is missing from checkout." } }
      - name: Build Windows application
        shell: pwsh
        run: pyinstaller --noconfirm --clean windows/app.spec
      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/All-Video-Downloader/tools | Out-Null
          Copy-Item (Get-Command ffmpeg).Source dist/All-Video-Downloader/tools/ffmpeg.exe
          Copy-Item (Get-Command ffprobe).Source dist/All-Video-Downloader/tools/ffprobe.exe
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' (Resolve-Path windows/setup.iss)
          $setup = Get-ChildItem -Path . -Recurse -File -Filter 'All-Video-Downloader-Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer was not produced.' }
          Copy-Item $setup.FullName release/All-Video-Downloader-Setup.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: All-Video-Downloader-Windows
          path: release/All-Video-Downloader-Setup.exe

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: All-Video-Downloader-*
          merge-multiple: true
          path: release
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create v1.0.0 release/All-Video-Downloader.apk release/All-Video-Downloader-Setup.exe --repo "$GITHUB_REPOSITORY" --title "All Video Downloader Without Watermark v1.0.0" --notes "Android APK and Windows installer built from the repository source. Use only for media you are authorized to download."
