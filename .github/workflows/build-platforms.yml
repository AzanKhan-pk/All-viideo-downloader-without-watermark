name: Legacy platform build (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  APP_VERSION_CODE: ${{ github.run_number }}

# This workflow is intentionally manual. The automatic fixed-release pipeline is
# .github/workflows/build-fixed-release.yml, which contains the current Android
# foreground-service and bundled Windows app-shell fixes.
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set Android version
        shell: bash
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${APP_VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName '[^']*'/versionName '${APP_VERSION}'/" android/app/build.gradle
          sed -i "s/private val currentVersion = \"[^\"]*\"/private val currentVersion = \"${APP_VERSION}\"/" android/app/src/main/java/pk/azankhan/alldownloader/MainActivity.kt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable AndroidX
        run: echo 'android.useAndroidX=true' >> android/gradle.properties
      - name: Build signed release APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify signed APK
        shell: bash
        run: |
          set -e
          APK=$(find android/app/build/outputs -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" All-Video-Downloader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: All-Video-Downloader-Android
          path: All-Video-Downloader.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply current release patches
        shell: pwsh
        run: |
          python tools/release_patch.py
          python tools/tiktok_focus_patch.py
          python tools/ui_polish_patch.py
          python tools/persistence_gallery_patch.py
          python tools/fix_windows_runtime.py
          python tools/final_browser_architecture.py
          python tools/final_download_reliability_patch.py
      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile app.py
          python -m py_compile windows/launcher.py
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt
          choco install ffmpeg imagemagick innosetup -y --no-progress
      - name: Generate ICO from project SVG
        shell: pwsh
        run: magick static/icon.svg -background none -define icon:auto-resize=256,128,64,48,32,16 windows/app.ico
      - name: Build Windows application
        shell: pwsh
        run: pyinstaller --noconfirm --clean windows/app.spec
      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/All-Video-Downloader/tools | Out-Null
          Copy-Item (Get-Command ffmpeg).Source dist/All-Video-Downloader/tools/ffmpeg.exe
          Copy-Item (Get-Command ffprobe).Source dist/All-Video-Downloader/tools/ffprobe.exe
      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' (Resolve-Path windows/setup.iss)
          if (-not (Test-Path release/All-Video-Downloader-Setup.exe)) { throw 'Windows installer was not produced.' }
      - uses: actions/upload-artifact@v4
        with:
          name: All-Video-Downloader-Windows
          path: release/All-Video-Downloader-Setup.exe

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: All-Video-Downloader-*
          merge-multiple: true
          path: release
      - name: Publish manual legacy build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "legacy-v${APP_VERSION}" release/All-Video-Downloader.apk release/All-Video-Downloader-Setup.exe --repo "$GITHUB_REPOSITORY" --title "Legacy manual build ${APP_VERSION}" --notes "Manual-only compatibility build. For the current automatic release, use the fixed-release workflow."
