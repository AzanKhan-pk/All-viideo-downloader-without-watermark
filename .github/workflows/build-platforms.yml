name: Build Android and Windows releases

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  APP_VERSION_CODE: ${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Android version
        shell: bash
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${APP_VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName '[^']*'/versionName '${APP_VERSION}'/" android/app/build.gradle
          sed -i "s/private val currentVersion = \"[^\"]*\"/private val currentVersion = \"${APP_VERSION}\"/" android/app/src/main/java/pk/azankhan/alldownloader/MainActivity.kt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable AndroidX
        run: echo 'android.useAndroidX=true' >> android/gradle.properties
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Find and rename APK
        shell: bash
        run: |
          set -e
          APK=$(find android/app/build/outputs -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" All-Video-Downloader.apk
          ls -lh All-Video-Downloader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: All-Video-Downloader-Android
          path: All-Video-Downloader.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Windows app fixes
        shell: pwsh
        run: |
          python tools/release_patch.py
          python tools/tiktok_focus_patch.py
          python tools/ui_polish_patch.py
          python tools/persistence_gallery_patch.py
      - name: Set Windows version
        shell: pwsh
        run: |
          $launcher = Get-Content windows/launcher.py -Raw
          $launcher = [regex]::Replace($launcher, 'APP_VERSION = "[^"]*"', "APP_VERSION = `"$env:APP_VERSION`"")
          Set-Content windows/launcher.py $launcher -NoNewline
          $iss = Get-Content windows/setup.iss -Raw
          $iss = [regex]::Replace($iss, '#define MyAppVersion "[^"]*"', "#define MyAppVersion `"$env:APP_VERSION`"")
          Set-Content windows/setup.iss $iss -NoNewline
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt
          choco install ffmpeg imagemagick innosetup -y --no-progress
      - name: Generate ICO from project SVG
        shell: pwsh
        run: magick static/icon.svg -background none -define icon:auto-resize=256,128,64,48,32,16 windows/app.ico
      - name: Verify Windows sources
        shell: pwsh
        run: |
          foreach ($f in @('windows/launcher.py','windows/app.spec','windows/setup.iss')) { if (-not (Test-Path $f)) { throw "$f is missing from checkout." } }
      - name: Build Windows application
        shell: pwsh
        run: pyinstaller --noconfirm --clean windows/app.spec
      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/All-Video-Downloader/tools | Out-Null
          Copy-Item (Get-Command ffmpeg).Source dist/All-Video-Downloader/tools/ffmpeg.exe
          Copy-Item (Get-Command ffprobe).Source dist/All-Video-Downloader/tools/ffprobe.exe
      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' (Resolve-Path windows/setup.iss)
          $setup = Join-Path (Get-Location) 'release/All-Video-Downloader-Setup.exe'
          if (-not (Test-Path $setup)) { throw "Installer was not produced at $setup" }
          Write-Host "Installer exists: $setup"
          Get-Item $setup | Format-List FullName,Length
      - uses: actions/upload-artifact@v4
        with:
          name: All-Video-Downloader-Windows
          path: release/All-Video-Downloader-Setup.exe

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: All-Video-Downloader-*
          merge-multiple: true
          path: release
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${APP_VERSION}" release/All-Video-Downloader.apk release/All-Video-Downloader-Setup.exe --repo "$GITHUB_REPOSITORY" --title "All Video Downloader Without Watermark v${APP_VERSION}" --notes "Android APK and Windows installer built automatically from the repository source. Windows includes persistent background downloads, restart/resume progress, in-page folder controls, removable download cards, file-in-folder actions, TikTok-focused extraction reliability, and public image gallery support. Use only for public media you are authorized to download."
