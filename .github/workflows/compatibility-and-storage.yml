name: Improve compatibility and storage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply compatibility and storage improvements
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = False

          # -------------------------------------------------
          # Backend: use a broad yt-dlp configuration.  yt-dlp
          # maintains the extractor list for many services;
          # there is deliberately no hard-coded small allowlist.
          # -------------------------------------------------
          app = Path('app.py')
          text = app.read_text(encoding='utf-8')

          if '"impersonate": "chrome"' not in text:
              marker = '        "socket_timeout": 30,\n\n'
              insert = '''        "socket_timeout": 30,\n\n        # Modern sites increasingly require browser-like TLS/HTTP behavior.\n        # curl_cffi is declared in requirements.txt and yt-dlp uses it when\n        # available. This does not bypass private media, DRM or login gates.\n        "impersonate": "chrome",\n\n        "http_headers": {\n            "User-Agent": (\n                "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "\n                "AppleWebKit/537.36 (KHTML, like Gecko) "\n                "Chrome/140.0.0.0 Safari/537.36"\n            ),\n            "Accept-Language": "en-US,en;q=0.9",\n        },\n\n'''
              if marker in text:
                  text = text.replace(marker, insert, 1)
                  changed = True

          # More retries help when a public extractor endpoint is temporarily\n          # flaky. Keep playlist behavior unchanged.
          if '"extractor_retries": 3' not in text:
              marker = '        "retries": 5,\n'
              if marker in text:
                  text = text.replace(marker, marker + '        "extractor_retries": 3,\n', 1)
                  changed = True

          app.write_text(text, encoding='utf-8')

          # -------------------------------------------------
          # Web UI: add a visible location section. Browsers do
          # not permit silent arbitrary filesystem writes, so the
          # website keeps normal browser downloads while the native
          # Windows app exposes the real folder chooser.
          # -------------------------------------------------
          html = Path('templates/index.html')
          h = html.read_text(encoding='utf-8')

          css = r'''

/* =========================================================
   DOWNLOAD LOCATION
========================================================= */

.location-panel {
    margin-top: 12px;
    padding: 12px 14px;
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 14px;
    background: rgba(255,255,255,.035);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.location-info {
    min-width: 0;
}

.location-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    opacity: .65;
}

.location-path {
    margin-top: 4px;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.location-btn {
    flex: 0 0 auto;
    border: 1px solid rgba(250,204,21,.28);
    border-radius: 10px;
    padding: 9px 12px;
    background: rgba(250,204,21,.08);
    color: #facc15;
    font-weight: 800;
    cursor: pointer;
}

.location-btn:hover { background: rgba(250,204,21,.14); }

@media (max-width:760px) {
    .location-panel { align-items: stretch; flex-direction: column; }
    .location-btn { width: 100%; }
}
'''
          if '.location-panel {' not in h:
              h = h.replace('</style>', css + '\n</style>', 1)
              changed = True

          # Insert a location display immediately after the input row.
          marker = '''    </div>\n\n\n    <div class="modes">'''
          replacement = '''    </div>\n\n    <div class="location-panel" id="locationPanel">\n        <div class="location-info">\n            <div class="location-label">Download location</div>\n            <div class="location-path" id="locationPath">Browser default / Video downloader</div>\n        </div>\n        <button class="location-btn" id="locationButton" type="button">📁 Choose location</button>\n    </div>\n\n    <div class="modes">'''
          if 'id="locationPanel"' not in h and marker in h:
              h = h.replace(marker, replacement, 1)
              changed = True

          js = r'''

/* =========================================================
   DOWNLOAD LOCATION UI
========================================================= */

(function initDownloadLocation() {
    const button = document.getElementById('locationButton');
    const path = document.getElementById('locationPath');
    if (!button || !path) return;

    const nativeApi = window.pywebview && window.pywebview.api;

    function refreshNative() {
        if (!nativeApi || !nativeApi.get_download_folder) return false;
        nativeApi.get_download_folder().then(folder => {
            if (typeof folder === 'string' && folder) path.textContent = folder;
        }).catch(() => {});
        return true;
    }

    button.addEventListener('click', async () => {
        if (nativeApi && nativeApi.browse_folder) {
            const folder = await nativeApi.browse_folder();
            if (typeof folder === 'string' && folder) path.textContent = folder;
            return;
        }

        // Modern Chromium browsers can choose a directory, but they still
        // require an explicit user gesture and permission for filesystem access.
        if (window.showDirectoryPicker) {
            try {
                const handle = await window.showDirectoryPicker({mode: 'readwrite'});
                path.textContent = handle.name + ' (browser permission granted)';
                localStorage.setItem('avd_download_folder_name', handle.name);
                return;
            } catch (_) {}
        }

        path.textContent = 'Browser default Downloads folder';
        showToast('For automatic folder saving, use the Windows app or browser download settings.');
    });

    if (!refreshNative()) {
        const saved = localStorage.getItem('avd_download_folder_name');
        if (saved) path.textContent = saved + ' (browser permission granted)';
    }
})();
'''
          if 'initDownloadLocation' not in h:
              marker = '</script>\n\n</body>'
              if marker in h:
                  h = h.replace(marker, js + '\n</script>\n\n</body>', 1)
                  changed = True

          html.write_text(h, encoding='utf-8')

          # -------------------------------------------------
          # Native Windows app: make the default location explicit.
          # It already uses %USERPROFILE%\\Downloads\\Video downloader;
          # add a marker so the launcher can display it without a
          # separate dark popup/window.
          # -------------------------------------------------
          launcher = Path('windows/launcher.py')
          if launcher.exists():
              l = launcher.read_text(encoding='utf-8')
              l2 = l.replace(
                  'Download folder: loading…',
                  'Download folder: Downloads\\Video downloader'
              )
              if l2 != l:
                  launcher.write_text(l2, encoding='utf-8')
                  changed = True

          if changed:
              print('Compatibility/storage updates applied.')
          else:
              print('No changes needed.')

      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/index.html windows/launcher.py
          git commit -m "Improve site compatibility and download location"
          git push
