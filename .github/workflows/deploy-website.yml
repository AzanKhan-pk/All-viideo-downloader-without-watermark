name: Deploy download website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'static/icon.svg'
      - 'static/manifest.json'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site/static
          cp website/index.html _site/index.html
          cp static/icon.svg _site/static/icon.svg
          cp static/manifest.json _site/static/manifest.json
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
