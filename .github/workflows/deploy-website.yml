name: Deploy download website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'static/icon.svg'
      - 'static/manifest.json'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare website
        run: |
          rm -rf _site
          mkdir -p _site/static
          cp website/index.html _site/index.html
          cp website/version.json _site/version.json
          cp website/sw.js _site/sw.js
          cp static/icon.svg _site/static/icon.svg
          cp static/manifest.json _site/static/manifest.json
          touch _site/.nojekyll
      - name: Publish website to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          commit_message: 'Deploy download website with update metadata'
