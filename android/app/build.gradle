plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'pk.azankhan.alldownloader'
    compileSdk 36
    defaultConfig {
        applicationId 'pk.azankhan.alldownloader'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.0.5'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
}

tasks.register('prepareOriginalWebAssets', Copy) {
    from('../../app.py') { into('.') }
    from('../../templates') { into('templates') }
    from('../../static') { into('static') }
    into("${projectDir}/src/main/assets/original")
}

tasks.named('preBuild') { dependsOn(tasks.named('prepareOriginalWebAssets')) }

chaquopy {
    defaultConfig {
        version = '3.13'
        pip {
            // Keep Android dependencies to packages with Chaquopy-compatible wheels.
            // curl_cffi is optional in yt-dlp and was causing the release build to fail
            // while pip was installing native Android dependencies.
            install('Flask==3.1.3')
            install('yt-dlp==2026.8.19')
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'
}
